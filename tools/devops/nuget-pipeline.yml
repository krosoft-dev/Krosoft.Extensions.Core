name: Nuget 'Krosoft.Extensions.Core' - $(Date:yyyy.MM.dd).$(BuildID)

pr: none

resources:
  repositories:
    - repository: Krosoft.Extensions
      type: github
      name: krosoft-dev/Krosoft.Extensions
      endpoint: krosoft-dev

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src
      - Directory.Build.props

variables:
  - template: ./vars/vars.yml

extends:
  template: tools/devops/templates/pipelines/nuget-template.yml@Krosoft.Extensions
  parameters:
    dotNetVersion: ${{ variables.dotNetVersion }}
    packages:
      - "Krosoft.Extensions.Core"
